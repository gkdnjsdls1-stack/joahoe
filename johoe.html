<title>좋아회</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 우표첩 한 권: 앨범지 위에 톱니 달린 우표가 2열로 꽂힌다. 상단 세그먼트 2개, 나머지는 전체화면 시트. */
:root{
  --album:#E7EAEE;        /* 앨범 바탕 */
  --paper:#FFFFFF;        /* 우표 종이 */
  --ink:#1B2430;          /* 본문 */
  --ink-soft:#67717E;     /* 보조 */
  --line:#C9D0D8;         /* 선 */
  --post:#BE3A2B;         /* 우체국 빨강 */
  --postal:#1F4E79;       /* 우체국 파랑 */
  --gold:#8A6A1F;
  --m1:#BE3A2B; --m2:#1F4E79; --m3:#5E7033;
  --f-disp:"Gowun Batang",ui-serif,Georgia,serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --album:#15191F; --paper:#212832; --ink:#E7EBF0; --ink-soft:#97A1AE; --line:#39424E;
  --post:#E0675A; --postal:#7FB2E0; --gold:#C9A75A;
  --m1:#E0675A; --m2:#7FB2E0; --m3:#9DB45F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --album:#15191F; --paper:#212832; --ink:#E7EBF0; --ink-soft:#97A1AE; --line:#39424E;
  --post:#E0675A; --postal:#7FB2E0; --gold:#C9A75A;
  --m1:#E0675A; --m2:#7FB2E0; --m3:#9DB45F;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--album);color:var(--ink);font-family:var(--f-body);line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--postal);outline-offset:2px}

/* ── 헤더 ── */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--album);
  padding-top:14px;padding-bottom:2px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)))}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand h1{font-family:var(--f-disp);font-size:26px;font-weight:700;letter-spacing:.02em}
.whoami{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 2px;font-size:13px;color:var(--ink-soft)}
.seg{display:flex;gap:15px;margin-top:10px;border-bottom:1px solid var(--line)}
.seg button{background:none;border:0;padding:8px 0 10px;font-size:14.5px;font-weight:600;color:var(--ink-soft);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--post)}
.seg .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);margin-left:3px}

/* ── 우표 ── */
.yearbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 12px}
.yearbar h2{font-family:var(--f-mono);font-size:13px;letter-spacing:.14em;color:var(--ink-soft);font-weight:500}
.yearnav{display:flex;gap:4px}
.yearnav button{background:none;border:1px solid var(--line);border-radius:4px;width:26px;height:26px;
  line-height:1;color:var(--ink-soft);font-size:13px;display:grid;place-items:center}
.yearnav button[disabled]{opacity:.3;cursor:default}

.banner{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-left:3px solid var(--post);border-radius:3px;padding:10px 12px;font-size:13.5px;margin-bottom:16px}
.banner strong{font-family:var(--f-mono);font-weight:500}
.banner[aria-pressed="true"]{border-left-width:6px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 18px}
.cell{display:flex;flex-direction:column;gap:7px;min-width:0}
.stamp{position:relative;aspect-ratio:1;background:var(--paper);border:0;padding:0;display:block;width:100%;
  box-shadow:0 1px 3px rgba(16,24,36,.14)}
.stamp::before{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px;pointer-events:none;z-index:2;
  background:
    radial-gradient(circle 4.5px at 8px 5px,var(--album) 98%,#0000) top left/16px 10px repeat-x,
    radial-gradient(circle 4.5px at 8px 5px,var(--album) 98%,#0000) bottom left/16px 10px repeat-x}
.stamp::after{content:"";position:absolute;top:0;bottom:0;left:-5px;right:-5px;pointer-events:none;z-index:2;
  background:
    radial-gradient(circle 4.5px at 5px 8px,var(--album) 98%,#0000) top left/10px 16px repeat-y,
    radial-gradient(circle 4.5px at 5px 8px,var(--album) 98%,#0000) top right/10px 16px repeat-y}
.stamp .inner{position:absolute;inset:6px;overflow:hidden;background:var(--album);display:grid;place-items:center}
.stamp img{width:100%;height:100%;object-fit:cover;display:block}
.stamp.temp img{filter:grayscale(1) contrast(1.06)}
.stamp .ph{font-family:var(--f-disp);font-size:13px;color:var(--ink-soft);text-align:center;padding:8px}
.mark{position:absolute;right:4px;top:4px;z-index:3;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--post);border:1.5px solid var(--post);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;
  transform:rotate(-13deg);opacity:.8;background:color-mix(in srgb,var(--paper) 70%,transparent)}
.cap{display:flex;flex-direction:column;gap:3px;min-width:0}
.cap .food{font-family:var(--f-disp);font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.cap .shop{font-size:11.5px;color:var(--ink-soft);overflow-wrap:anywhere}
.cap .row{display:flex;align-items:center;gap:7px}
.cap .d{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;border:1.2px solid var(--ink-soft)}
.dot.on{border-color:transparent}

.slot{aspect-ratio:1;width:100%;border:1.5px dashed var(--line);border-radius:3px;background:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-soft)}
.slot .big{font-family:var(--f-disp);font-size:15px}
.slot .sm{font-size:11px}

/* ── 가고 싶은 곳 ── */
.sect{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--ink-soft);margin:20px 0 9px}
.wish{display:flex;flex-direction:column;gap:9px}
.wcard{display:flex;align-items:flex-start;gap:10px;background:var(--paper);border:1px solid var(--line);
  border-radius:3px;padding:11px 12px}
.wcard.hit{border-color:var(--post);box-shadow:0 0 0 2px color-mix(in srgb,var(--post) 22%,transparent)}
.wcard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wcard .nm{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.wcard .why{font-size:12.5px;color:var(--ink-soft);overflow-wrap:anywhere}
.wcard .stale{font-family:var(--f-mono);font-size:11px;color:var(--gold)}
.likebtn{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 8px;display:flex;gap:3px;align-items:center}
.disc{margin:18px 0;border:0;border-top:1px solid var(--line)}
.foldlink{background:none;border:0;padding:8px 0;font-size:13px;color:var(--ink-soft);display:block;text-align:left}
.ext{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--postal);text-decoration:none;
  border-bottom:1px solid var(--line);align-self:flex-start;padding-bottom:1px}
.area{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.meta-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mgroup{background:var(--paper);border:1px solid var(--line);border-radius:3px;margin-bottom:10px;overflow:hidden}
.mgroup h3{display:flex;align-items:baseline;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);
  font-family:var(--f-disp);font-size:16px;font-weight:700}
.mgroup h3 .c{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft);font-weight:400}
.mrow{display:flex;align-items:center;gap:9px;padding:11px 12px;border-bottom:1px solid var(--line)}
.mgroup .mrow:last-child{border-bottom:0}
.mrow .nmbtn{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;font-size:14.5px;
  font-weight:500;overflow-wrap:anywhere}
.mrow .st{font-family:var(--f-mono);font-size:11px;color:var(--ink-soft);white-space:nowrap}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.thumbs button{aspect-ratio:1;border:1px solid var(--line);background:var(--album);padding:0;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs img.t{filter:grayscale(1)}
.mapwrap{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:8px;margin-bottom:12px}
.mapsvg{width:100%;height:auto;display:block;aspect-ratio:1;touch-action:none}
.mapsvg .gl{stroke:var(--line);stroke-width:.22;opacity:.55}
.mapsvg .ring{fill:none;stroke:var(--line);stroke-width:.3;stroke-dasharray:1.3 1.3}
.mapsvg .al{font-family:var(--f-mono);font-size:3.3px;letter-spacing:.12em;fill:var(--ink-soft);
  cursor:grab;user-select:none;-webkit-user-select:none}
.mapsvg .al.on{fill:var(--ink)}
.mapsvg .pin{cursor:pointer}
.mapsvg .pn{font-size:2.8px;fill:var(--ink-soft);font-family:var(--f-body);pointer-events:none}
.mapsvg .sel{fill:none;stroke:var(--ink);stroke-width:.4}
.maplegend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 3px 1px;font-size:11.5px;color:var(--ink-soft)}
.maplegend .k{display:inline-flex;align-items:center;gap:5px}
.maplegend .k i{width:9px;height:9px;border-radius:50%;display:inline-block}
.maplegend button{margin-left:auto;background:none;border:1px solid var(--line);border-radius:999px;
  padding:4px 10px;font-size:11.5px;color:var(--ink-soft)}
.maplegend button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.pincard{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--postal);
  border-radius:3px;padding:11px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
.pincard.wish{border-left-color:var(--post)}
.pincard .nm{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.pincard .st{font-size:12.5px;color:var(--ink-soft)}
.pincard .act{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:3px}

/* ── 공통 ── */
.empty{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:26px 18px;text-align:center;
  display:flex;flex-direction:column;gap:7px;align-items:center}
.empty .t{font-family:var(--f-disp);font-size:17px;font-weight:700}
.empty .s{font-size:13px;color:var(--ink-soft);max-width:30ch}
.fab{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--album) 62%,transparent)}
.fab button{width:100%;max-width:528px;background:var(--ink);color:var(--album);border:0;border-radius:4px;
  padding:14px;font-size:15px;font-weight:600}
.btn{background:var(--ink);color:var(--album);border:0;border-radius:4px;padding:13px 16px;font-size:15px;font-weight:600;width:100%}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto}
.row2{display:flex;gap:9px}
.row2>*{flex:1;min-width:0}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-soft);font-weight:500}
.fld input,.fld textarea,.fld select{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:11px 12px;font-size:15px;width:100%}
.fld textarea{resize:vertical;min-height:72px}
.hint{font-size:12px;color:var(--ink-soft)}

/* 시트 */
.sheet{position:fixed;inset:0;z-index:50;background:var(--album);overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto}
.sheet .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 6px;position:sticky;
  top:0;background:var(--album);z-index:2}
.sheet .bar h2{font-family:var(--f-disp);font-size:18px;font-weight:700;overflow-wrap:anywhere}
.sheet .bar button{background:none;border:0;font-size:14px;color:var(--ink-soft);padding:6px 2px;white-space:nowrap}
.form{display:flex;flex-direction:column;gap:16px;padding:10px 0 4px}

.pick{display:flex;gap:7px;flex-wrap:wrap}
.pick button{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13.5px;display:flex;gap:6px;align-items:center}
.pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.swatch{width:11px;height:11px;border-radius:50%;display:inline-block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--album),0 0 0 3.5px var(--ink)}

.drop{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:3px;background:var(--paper);
  display:grid;place-items:center;overflow:hidden;position:relative}
.drop img{width:100%;height:100%;object-fit:cover}
.drop .lbl{font-size:14px;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:14px}

.detail-stamp{max-width:300px;margin:6px auto 0}
.lines{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.lineitem{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.lineitem .who{font-size:12.5px;font-weight:600;min-width:52px;padding-top:1px}
.lineitem .txt{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere}
.lineitem .txt.none{color:var(--ink-soft)}
.lineitem input{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:8px 10px;font-size:14.5px}

.steps{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:3px;background:var(--paper)}
.step{display:flex;align-items:center;gap:11px;padding:12px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-soft);width:14px;flex:none}
.step .what{flex:1;min-width:0;font-size:14px}
.step .what small{display:block;color:var(--ink-soft);font-size:11.5px}
.promptbox{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:3px}
.promptbox pre{margin:0;padding:12px;font-family:var(--f-mono);font-size:11.5px;line-height:1.65;
  white-space:pre-wrap;overflow-wrap:anywhere;max-height:230px;overflow-y:auto}
.refrow{display:flex;gap:8px;flex-wrap:wrap}
.refrow .r{width:56px;height:56px;border:1px solid var(--line);background:var(--paper);overflow:hidden}
.refrow .r img{width:100%;height:100%;object-fit:cover}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:100;
  background:var(--ink);color:var(--album);padding:10px 16px;border-radius:999px;font-size:13.5px;max-width:86vw;text-align:center}
.center{display:flex;flex-direction:column;gap:14px;align-items:stretch;padding:40px 0 0}
.center h2{font-family:var(--f-disp);font-size:22px;font-weight:700;text-align:center}
.center p{margin:0;text-align:center;font-size:13.5px;color:var(--ink-soft)}
.who3{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.who3 button{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:16px;font-size:16px;
  font-weight:600;display:flex;align-items:center;gap:10px;justify-content:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(6px)}}}
</style>

<div class="wrap">
  <header id="hdr" hidden>
    <div class="brand">
      <h1>좋아회</h1>
      <button class="whoami" id="whoBtn"><span class="swatch" id="whoSw"></span><span id="whoNm"></span> ⋯</button>
    </div>
    <div class="seg" role="tablist">
      <button role="tab" id="tabAlbum" aria-selected="true">우표첩</button>
      <button role="tab" id="tabWish" aria-selected="false">가고 싶은 곳<span class="n" id="wishN"></span></button>
      <button role="tab" id="tabMap" aria-selected="false">지도</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="fab" id="fab" hidden><button id="fabBtn">＋ 우표 발행</button></div>
<div id="sheets"></div>
<div id="toasts"></div>

<script>
(function(){
"use strict";
const MEMBERS=[{id:"m1",v:"--m1"},{id:"m2",v:"--m2"},{id:"m3",v:"--m3"}];
const COLORS=[
  {key:"brick",ko:"벽돌색",en:"brick red",hex:"#B6422F"},
  {key:"mustard",ko:"머스터드",en:"mustard yellow",hex:"#C99A2E"},
  {key:"olive",ko:"올리브",en:"olive green",hex:"#6E7F3A"},
  {key:"teal",ko:"딥틸",en:"deep teal",hex:"#2A6B70"},
  {key:"orange",ko:"번트오렌지",en:"burnt orange",hex:"#C4652A"},
  {key:"plum",ko:"플럼",en:"plum purple",hex:"#7A4A74"}
];
const LS_ME="johoe.me";
let db=null,assets=null,dls=null,userCap=null;
let settings=null,stamps=[],shops=[],me=null;
let ready={settings:false,stamps:false,shops:false};
let tab="album",year=null,onlyTemp=false,showFolded=false,sheet=null,busy=false;
let selPin=null,showNames=false,dragArea=null;

/* ── 유틸 ── */
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function todayISO(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function fmtMD(iso){if(!iso)return"";const[,m,d]=iso.split("-");return (m||"").replace(/^0/,"")+"."+(d||"");}
function daysSince(iso){if(!iso)return 0;const t=Date.parse(iso+"T00:00:00");if(isNaN(t))return 0;return Math.floor((Date.now()-t)/86400000);}
function memberName(id){const m=(settings&&settings.members||[]).find(x=>x.id===id);return (m&&m.name)||"";}
function memberVar(id){const m=MEMBERS.find(x=>x.id===id);return m?("var("+m.v+")"):"var(--ink-soft)";}
function toast(msg){const t=el("div","toast",msg);$("#toasts").appendChild(t);setTimeout(()=>t.remove(),2600);}
function colorOf(k){return COLORS.find(c=>c.key===k)||null;}
function safeUrl(u){
  u=String(u==null?"":u).trim();
  if(!u)return "";
  if(!/^https?:\/\//i.test(u)){
    if(/^[\w.-]+\.[a-z]{2,}/i.test(u))u="https://"+u;else return "";
  }
  try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:"";}catch(e){return "";}
}
function hostOf(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "링크";}}
function linkEl(u){
  const href=safeUrl(u);if(!href)return null;
  const a=document.createElement("a");a.className="ext";a.href=href;a.target="_blank";a.rel="noopener noreferrer";
  a.textContent="↗ "+hostOf(href);
  a.onclick=e=>e.stopPropagation();

}

/* ── 이미지 ── */
function shrink(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        const max=1400;let{width:w,height:h}=img;
        const s=Math.min(1,max/Math.max(w,h));
        const cv=document.createElement("canvas");
        cv.width=Math.round(w*s);cv.height=Math.round(h*s);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        cv.toBlob(b=>{URL.revokeObjectURL(url);res(b&&b.size?b:file)},"image/jpeg",.85);
      }catch(e){URL.revokeObjectURL(url);res(file)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(file)};
    img.src=url;
  });
}
async function uploadImage(file){
  if(!assets){toast("사진을 올릴 권한이 없어요. 공유 메뉴에서 Editor로 초대받아야 해요.");return null;}
  const blob=await shrink(file);
  try{
    const r=await assets.upload(blob,{type:blob.type||"image/jpeg"});
    return r.id;
  }catch(e){
    const c=e&&e.code;
    toast(c==="too_large"?"사진이 너무 커요.":c==="not_granted"?"사진을 올릴 권한이 없어요.":"사진을 올리지 못했어요.");
    return null;
  }
}
const blobUrl=id=>"/_blob/"+id;
async function saveToPhotos(id,name){
  if(!dls){toast("이미지를 길게 눌러 저장하세요.");return;}
  try{
    const r=await fetch(blobUrl(id));const b=await r.blob();
    await dls.save({filename:name,data:b});
  }catch(e){
    if(e&&e.code==="declined")return;
    toast("이미지를 길게 눌러 저장하세요.");
  }
}

const SVGNS="http://www.w3.org/2000/svg";
function svgEl(t,attrs){
  const n=document.createElementNS(SVGNS,t);
  for(const k in attrs)n.setAttribute(k,attrs[k]);
  return n;
}
function hashStr(s){
  s=String(s);let h=0;
  for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
  return Math.abs(h);
}
function areaPosOf(name){
  const saved=((settings&&settings.areaPos)||{})[name];
  if(saved&&typeof saved.x==="number"&&typeof saved.y==="number")return{x:saved.x,y:saved.y};
  const h=hashStr(name);
  return {x:20+(h%61),y:24+((h>>7)%57)};
}
function clusterR(n){return n<=1?4:n<=4?8:10.5;}
function shopOffset(i,n){
  if(n<=1)return{dx:0,dy:0};
  const a=(i/n)*Math.PI*2-Math.PI/2;
  const r=n<=4?5.5:7.5;
  return{dx:Math.cos(a)*r,dy:Math.sin(a)*r*.85};
}
function startAreaDrag(e,key,svg,g,c){
  e.preventDefault();
  const t=e.currentTarget;
  try{t.setPointerCapture(e.pointerId);}catch(err){}
  let last=null;
  const move=ev=>{
    const r=svg.getBoundingClientRect();
    if(!r.width||!r.height)return;
    const x=Math.max(8,Math.min(92,(ev.clientX-r.left)/r.width*100));
    const y=Math.max(13,Math.min(94,(ev.clientY-r.top)/r.height*100));
    last={x:x,y:y};
    g.setAttribute("transform","translate("+(x-c.x).toFixed(2)+","+(y-c.y).toFixed(2)+")");
  };
  const up=()=>{
    t.removeEventListener("pointermove",move);
    t.removeEventListener("pointerup",up);
    t.removeEventListener("pointercancel",up);
    if(!last)return;
    const pos=Object.assign({},(settings&&settings.areaPos)||{});
    pos[key]={x:Math.round(last.x*10)/10,y:Math.round(last.y*10)/10};
    guard(()=>writeSettings({areaPos:pos}));
  };
  t.addEventListener("pointermove",move);
  t.addEventListener("pointerup",up);
  t.addEventListener("pointercancel",up);
}
function buildMap(groups,keys){
  const wrap=el("div","mapwrap");
  const svg=svgEl("svg",{viewBox:"0 0 100 100","class":"mapsvg",role:"img","aria-label":"동네 지도"});
  for(let i=1;i<10;i++){
    svg.appendChild(svgEl("line",{"class":"gl",x1:i*10,y1:0,x2:i*10,y2:100}));
    svg.appendChild(svgEl("line",{"class":"gl",x1:0,y1:i*10,x2:100,y2:i*10}));
  }
  svg.addEventListener("click",()=>{if(selPin){selPin=null;render();}});
  keys.forEach(k=>{
    const arr=groups.get(k),c=areaPosOf(k),n=arr.length;
    const g=svgEl("g",{});
    g.appendChild(svgEl("circle",{"class":"ring",cx:c.x,cy:c.y,r:clusterR(n)}));
    arr.forEach((s,i)=>{
      const o=shopOffset(i,n),x=c.x+o.dx,y=c.y+o.dy,wish=!!s.wish;
      if(wish&&likeScore(s)>=3){
        const ring=svgEl("circle",{cx:x,cy:y,r:3.1,"stroke-width":.35});
        ring.style.fill="none";ring.style.stroke="var(--post)";
        g.appendChild(ring);
      }
      const p=svgEl("circle",{"class":"pin",cx:x,cy:y,r:1.9,tabindex:"0",role:"button","aria-label":s.name});
      p.style.fill=wish?"var(--post)":"var(--postal)";
      const open=ev=>{ev.stopPropagation();selPin=(selPin===s.id?null:s.id);render();};
      p.addEventListener("click",open);
      p.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();open(ev);}});
      g.appendChild(p);
      if(selPin===s.id)g.appendChild(svgEl("circle",{"class":"sel",cx:x,cy:y,r:3.6}));
      if(showNames){
        const t=svgEl("text",{"class":"pn",x:x+2.9,y:y+1});
        t.textContent=s.name;g.appendChild(t);
      }
    });
    const lab=svgEl("text",{"class":"al"+(arr.some(s=>s.id===selPin)?" on":""),
      x:c.x,y:c.y-clusterR(n)-2.6,"text-anchor":"middle"});
    lab.textContent=k;
    lab.addEventListener("pointerdown",e=>startAreaDrag(e,k,svg,g,c));
    g.appendChild(lab);
    svg.appendChild(g);
  });
  wrap.appendChild(svg);
  const lg=el("div","maplegend");
  [["다녀온 곳","var(--postal)"],["가고 싶은 곳","var(--post)"]].forEach(pair=>{
    const k=el("span","k");const i=document.createElement("i");i.style.background=pair[1];
    k.appendChild(i);k.appendChild(el("span",null,pair[0]));lg.appendChild(k);
  });
  const nb=el("button",null,"이름 보기");
  nb.setAttribute("aria-pressed",String(showNames));
  nb.onclick=()=>{showNames=!showNames;render();};
  lg.appendChild(nb);
  wrap.appendChild(lg);
  return wrap;
}

function viewMap(){
  const frag=document.createDocumentFragment();
  const list=shops.filter(s=>!(s.wish&&s.folded));
  if(!list.length){
    const e=el("div","empty");
    e.appendChild(el("div","t","아직 가게가 없어요"));
    e.appendChild(el("div","s","우표를 발행하거나 가고 싶은 곳을 추가하면 지도에 점이 찍힙니다."));
    frag.appendChild(e);return frag;
  }
  const groups=new Map();
  list.forEach(s=>{const k=areaOf(s);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(s);});
  const keys=[...groups.keys()].sort((a,b)=>{
    if(a===AREA_UNSET)return 1;if(b===AREA_UNSET)return -1;
    return groups.get(b).length-groups.get(a).length||a.localeCompare(b,"ko");
  });
  const been=list.filter(s=>!s.wish).length,want=list.filter(s=>s.wish).length;
  const top=el("div","yearbar");
  top.appendChild(el("h2",null,"동네 "+keys.filter(k=>k!==AREA_UNSET).length+" · 다녀온 곳 "+been+" · 가고 싶은 곳 "+want));
  frag.appendChild(top);

  frag.appendChild(buildMap(groups,keys));
  const sel=selPin?list.find(s=>s.id===selPin):null;
  if(sel)frag.appendChild(pinCard(sel));
  else frag.appendChild(el("div","hint","점을 누르면 가게가 보이고, 동네 이름을 끌면 그 묶음이 옮겨집니다. 위치는 셋이 함께 씁니다."));

  keys.forEach(k=>{
    const g=el("div","mgroup");
    const h3=el("h3");
    h3.appendChild(el("span",null,k));
    const arr=groups.get(k);
    h3.appendChild(el("span","c",arr.filter(s=>!s.wish).length+"곳 · ★"+arr.filter(s=>s.wish).length));
    g.appendChild(h3);
    arr.slice().sort((a,b)=>(a.wish?1:0)-(b.wish?1:0)||String(a.name).localeCompare(String(b.name),"ko"))
      .forEach(s=>g.appendChild(shopRow(s)));
    if(k===AREA_UNSET){
      const hint=el("div","mrow");
      hint.appendChild(el("span","st","가게를 눌러 동네를 적으면 여기서 묶입니다"));
      g.appendChild(hint);
    }
    frag.appendChild(g);
  });
  frag.appendChild(el("div","hint","목록에서도 같은 가게를 누를 수 있어요."));
  return frag;
}

    mine.forEach(st=>{
      const b=el("button");
      const id=st.artId||(st.photoIds&&st.photoIds[0]);
      if(id){
        const im=document.createElement("img");im.src=blobUrl(id);im.alt=st.foodKo||"";
        if(!st.artId)im.className="t";
        b.appendChild(im);
      }else{
        const sp=el("span",null,fmtMD(st.date));
        sp.style.fontFamily="var(--f-mono)";sp.style.fontSize="11px";sp.style.color="var(--ink-soft)";
        b.appendChild(sp);
      }
      b.title=(st.foodKo||"")+" "+fmtMD(st.date);
      b.onclick=()=>openSheet({k:"detail",id:st.id});
      t.appendChild(b);
    });
    f.appendChild(t);
  }

  f.appendChild(el("div","sect","가게 정보"));
  const l1=el("label","fld");l1.appendChild(el("span",null,"이름"));
  const nIn=document.createElement("input");nIn.id="shn_"+s.id;nIn.value=s.name||"";l1.appendChild(nIn);f.appendChild(l1);

  const l2=el("label","fld");l2.appendChild(el("span",null,"링크"));
  const uIn=document.createElement("input");uIn.id="shu_"+s.id;uIn.type="url";uIn.inputMode="url";
  uIn.value=s.url||"";uIn.placeholder="카카오맵 · 네이버 · 인스타 주소";
  l2.appendChild(uIn);l2.appendChild(el("div","hint","지도 앱 링크를 넣으면 목록에서 바로 열립니다."));
  f.appendChild(l2);

  const l3=el("label","fld");l3.appendChild(el("span",null,"동네"));
  const aIn=document.createElement("input");aIn.id="sha_"+s.id;aIn.value=s.area||"";aIn.placeholder="성수";
  aIn.maxLength=12;aIn.setAttribute("list","areaListS");
  l3.appendChild(aIn);l3.appendChild(areaDatalist("areaListS"));
  l3.appendChild(el("div","hint","지도 탭에서 동네별로 묶입니다."));
  f.appendChild(l3);

  const sv=el("button","btn","저장");
  sv.onclick=()=>{
    const nm=nIn.value.trim();
    if(!nm){toast("가게 이름을 적어주세요.");return;}
    const raw=uIn.value.trim(),safe=safeUrl(raw);
    if(raw&&!safe){toast("링크 주소를 확인해주세요.");return;}
    guard(async()=>{
      await db.doc("shops/"+s.id).update({name:nm,url:safe,area:aIn.value.trim()});
      if(nm!==s.name)
        for(const st of stamps.filter(x=>x.shopId===s.id))
          await db.doc("stamps/"+st.id).update({shopName:nm});
      toast("저장했어요.");closeSheet();
    });
  };
  f.appendChild(sv);

  if(s.wish){
    const fold=el("button","btn ghost",s.folded?"다시 펼치기":"접어두기");
    fold.onclick=()=>guard(async()=>{await db.doc("shops/"+s.id).update({folded:!s.folded});closeSheet();
      toast(s.folded?"다시 펼쳤어요.":"접어뒀어요. 언제든 펼칠 수 있어요.");});
    f.appendChild(fold);
    if(s.proposer===me){
      const del=el("button","foldlink","내 추천 지우기");
      del.onclick=()=>{
        del.textContent="정말 지울까요? 한 번 더 누르면 삭제됩니다";
        del.onclick=()=>guard(async()=>{await db.doc("shops/"+s.id).delete();closeSheet();toast("지웠어요.");});
      };
      f.appendChild(del);
    }else{
      f.appendChild(el("div","hint","남이 추천한 곳은 지울 수 없어요. 접어두기만 가능합니다."));
    }
  }
  body.appendChild(f);
}

function sheetVisited(h,body){
  h.textContent="다녀온 곳";
  const f=el("div","form");
  const vs=visitedShops().slice().sort((a,b)=>(b.visitedAt||0)-(a.visitedAt||0));
  if(!vs.length){f.appendChild(el("div","hint","아직 없어요."));body.appendChild(f);return;}
  const g=el("div","mgroup");
  vs.forEach(s=>g.appendChild(shopRow(s)));
  f.appendChild(g);
  f.appendChild(el("div","hint","가게를 누르면 링크와 동네를 적을 수 있어요."));
  body.appendChild(f);
}

function sheetSettings(h,body){
  h.textContent="설정";
  const f=el("div","form");

  f.appendChild(el("div","sect","나"));
  const who=el("div","pick");
  MEMBERS.forEach(m=>{
    const b=el("button");b.type="button";b.setAttribute("aria-pressed",String(me===m.id));
    const sw=el("span","swatch");sw.style.background=memberVar(m.id);
    b.appendChild(sw);b.appendChild(el("span",null,memberName(m.id)||m.id));
    b.onclick=()=>{me=m.id;lsSet(LS_ME,m.id);drawSheet();render();};
    who.appendChild(b);
  });
  f.appendChild(who);

  f.appendChild(el("div","sect","이름"));
  const ins=MEMBERS.map((m,i)=>{
    const l=el("label","fld");l.appendChild(el("span",null,"멤버 "+(i+1)));
    const inp=document.createElement("input");inp.id="setnm"+m.id;inp.value=memberName(m.id);inp.maxLength=8;
    l.appendChild(inp);f.appendChild(l);return inp;
  });
  const sv=el("button","btn ghost","이름 저장");
  sv.onclick=()=>guard(async()=>{
    await writeSettings({members:MEMBERS.map((m,i)=>({id:m.id,name:ins[i].value.trim()||memberName(m.id)}))});
    toast("저장했어요.");
  });
  f.appendChild(sv);

  f.appendChild(el("div","sect","우표 스타일"));
  const st=el("div","pick");
  [["B","플랫 일러스트"],["A","빈티지 우표"]].forEach(([k,nm])=>{
    const b=el("button");b.type="button";
    b.setAttribute("aria-pressed",String(((settings&&settings.style)||"B")===k));
    b.appendChild(el("span",null,nm));
    b.onclick=()=>guard(async()=>{await writeSettings({style:k});drawSheet();toast(nm+"로 바꿨어요.");});
    st.appendChild(b);
  });
  f.appendChild(st);
  f.appendChild(el("div","hint","재시도 없이 한 번에 쓰려면 플랫 일러스트가 안전합니다. 초반 10장은 한 명이 전담하세요."));

  const refs=((settings&&settings.refStampIds)||[]).map(id=>stamps.find(s=>s.id===id)).filter(s=>s&&s.artId);
  f.appendChild(el("div","sect","기준 우표 "+refs.length+"/3"));
  if(refs.length){
    const rr=el("div","refrow");
    refs.forEach(r=>{const c=el("div","r");const im=document.createElement("img");im.src=blobUrl(r.artId);im.alt="";c.appendChild(im);rr.appendChild(c);});
    f.appendChild(rr);
  }else{
    f.appendChild(el("div","hint","마음에 드는 그림 우표를 열어 ‘기준 우표로 지정’ 하세요. 지피티에 함께 첨부하면 스타일이 유지됩니다."));
  }

  f.appendChild(el("div","sect","링크"));
  f.appendChild(el("div","hint","브라우저 주소창의 이 페이지 링크를 셋이 공유하세요. 사진을 올리려면 공유 메뉴에서 Editor로 초대받아야 합니다."));
  body.appendChild(f);
}

/* ── 연결 ── */
$("#tabAlbum").onclick=()=>{tab="album";render();};
$("#tabWish").onclick=()=>{tab="wish";render();};
$("#tabMap").onclick=()=>{tab="map";render();};
$("#whoBtn").onclick=()=>openSheet({k:"settings"});
$("#fabBtn").onclick=()=>openSheet({k:"new"});
render();

(async function boot(){
  const c=window.claude;
  if(!c||!c.use){ready.settings=true;render();
    const m=$("#main");m.innerHTML="";
    const e=el("div","empty");
    e.appendChild(el("div","t","여기서는 열 수 없어요"));
    e.appendChild(el("div","s","claude.ai에 올라간 링크로 열면 셋의 우표첩이 같이 보입니다."));
    m.appendChild(e);return;}
  try{db=await c.use("db")}catch(e){db=null}
  try{assets=await c.use("assets")}catch(e){assets=null}
  try{dls=await c.use("downloads")}catch(e){dls=null}
  try{userCap=await c.use("user")}catch(e){userCap=null}
  if(!db){
    ready.settings=true;render();
    const m=$("#main");m.innerHTML="";
    const e=el("div","empty");
    e.appendChild(el("div","t","로그인이 필요해요"));
    e.appendChild(el("div","s","claude.ai에 로그인한 뒤 이 링크를 다시 열어주세요."));
    m.appendChild(e);return;
  }
  me=lsGet(LS_ME);
  db.doc("meta/settings").onSnapshot(s=>{
    settings=s.exists?s.data():null;ready.settings=true;
    if(!sheet)render();else drawSheet();
  },()=>{ready.settings=true;render();});
  db.collection("stamps").onSnapshot(s=>{
    stamps=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready.stamps=true;
    if(!sheet)render();
  },()=>{});
  db.collection("shops").onSnapshot(s=>{
    shops=s.docs.map(d=>Object.assign({id:d.id},d.data()));ready.shops=true;
    if(!sheet)render();
  },()=>{});
})();
})();
</script>
